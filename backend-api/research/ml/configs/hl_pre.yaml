# Hand-label-like synthetic wood: the shipped recipe's pre-training, on relabelled scenes only.
name: hl_pre
description: "Leaf/wood PointNeXt-S pre-trained on hand-label-like synthetic wood."
task: wood_leaf
cache: /group/bnbaileygrp/bnbailey/phytograph_ml/cache
out: /group/bnbaileygrp/bnbailey/phytograph_ml/runs
model: {variant: S}
hierarchy: {voxel: 0.01, levels: 5, k: 16}
channels: [dxyz]
crop: {max_points: 24000, clear_seed_prob: 0.25, clear_min_dist: 0.6}
train:
  - {name: synth_hl, weight: 1.0, domain: synthetic, splits: [train_hl]}
val: {splits: [val, val_synth_hl], max_points_per_item: 400000}
optim: {steps: 50000, batch: 8, lr: 0.002, weight_decay: 0.05, warmup: 1000, label_smoothing: 0.1}
eval_every: 2500
checkpoint_every: 500
workers: 14
seed: 0
