# Dense-crown fix (2026-09-25). Same recipe as the shipped final_S_finetune_s0
# (fine-tune from the seed-0 synthetic pre-training), plus clear-of-wood crop
# seeding and the hand-labeled redbud(s) dense_western.
name: dense_west
description: "Leaf/wood PointNeXt-S, clear-of-wood seeding + western redbud (eastern held out)."
task: wood_leaf
cache: /group/bnbaileygrp/bnbailey/phytograph_ml/cache
out: /group/bnbaileygrp/bnbailey/phytograph_ml/runs
model: {variant: S}
hierarchy: {voxel: 0.01, levels: 5, k: 16}
channels: [dxyz]
crop: {max_points: 24000, clear_seed_prob: 0.25, clear_min_dist: 0.6}
train:
  - {name: real, weight: 1.0, domain: real, splits: [train]}
  - {name: dense, weight: 0.15, datasets: [redbud_labeled], splits: [dense_western]}
val: {splits: [val, val_synth], max_points_per_item: 400000}
optim: {steps: 25000, batch: 8, lr: 0.0005, weight_decay: 0.05, warmup: 1000, label_smoothing: 0.1}
eval_every: 2500
checkpoint_every: 500
workers: 14
seed: 0
init: /group/bnbaileygrp/bnbailey/phytograph_ml/runs/final_S_synth_s0/package
