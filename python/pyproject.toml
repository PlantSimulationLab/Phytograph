[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phytograph"
# Kept equal to package.json's "version" and backend-api/main.py BACKEND_VERSION
# (see CLAUDE.md "Version-lock contract"); test_version_lock_quintet (python/tests/test_backend.py) pins it.
version = "0.97.0"
description = "Headless Python scripting API for Phytograph (LiDAR point clouds and plant architecture)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["httpx>=0.24", "numpy>=1.22"]

[project.optional-dependencies]
progress = ["tqdm"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["phytograph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
